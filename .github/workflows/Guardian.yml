name: guardian-tao
on:
  schedule:
    - cron: "*/10 * * * *"     # relanza; en la práctica GitHub lo dispara cada 3-6 h, por eso cada corrida vigila en ciclo
  workflow_dispatch: {}          # botón "Run workflow" para probar a mano
concurrency: { group: guardian, cancel-in-progress: false }
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: "Comprobar secreto ESTADO_TOKEN (lee el estado del bot desde GitHub)"
        if: ${{ env.TIENE_TOKEN != '' }}
        run: echo "ESTADO_TOKEN presente"
        env:
          TIENE_TOKEN: ${{ secrets.ESTADO_TOKEN }}
      - run: python guardian.py
        env:
          BITUNIX_API_KEY: ${{ secrets.BITUNIX_API_KEY }}
          BITUNIX_SECRET_KEY: ${{ secrets.BITUNIX_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LATIDO_TOPIC: ${{ secrets.LATIDO_TOPIC }}
          ESTADO_TOKEN: ${{ secrets.ESTADO_TOKEN }}
          LATIDO_MIN: "20"
          DURACION_MIN: "350"          # v2.5: vigila ~5 h 50 min por corrida (máximo de GitHub: 6 h)
          PAUSA_MIN: "5"               # una revisión cada 5 min
          MODO: ${{ vars.MODO || 'papel' }}
          SIMBOLOS: TAOUSDT
          GRACIA_MIN: "10"
          RIESGO_MAX: "8.5"          # v7.9: firma ×2 puede arriesgar hasta 2 % × 2 (freno) × 2 (firma) = 8 %
